name: Build and validate Cutadapt
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cutadapt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang git curl xz-utils patch
      - run: npm ci
      - name: Test runtime, comparisons and release checks
        run: npm test
      - name: Verify real reads and their regeneration
        run: |
          python3 scripts/fetch-cutadapt-test-data.py --verify
          python3 scripts/fetch-cutadapt-test-data.py --fetch-sources
          python3 scripts/fetch-cutadapt-test-data.py --regenerate
      - name: Build native and WebAssembly Cutadapt
        run: python3 scripts/build-cutadapt.py all
      - name: Compare Node results with native Cutadapt
        run: node scripts/validate-cutadapt.mjs --engine node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutadapt-validation-node
          path: reports/cutadapt/node/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: cutadapt-compiled
          path: |
            dist/cutadapt/
            build/native/cutadapt
            build/native/cutadapt-entry.py
            build/native/cutadapt-packages/
            build/patched-native/cutadapt
            build/patched-native/cutadapt-entry.py
            build/patched-native/cutadapt-packages/
          if-no-files-found: error
          retention-days: 14
  browsers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: cutadapt-compiled
          path: .
      - run: chmod u+x build/native/cutadapt build/patched-native/cutadapt
      - name: Compare browser results with native Cutadapt
        run: node scripts/validate-cutadapt.mjs --engine ${{ matrix.browser }}
      - name: Check uploads, downloads, cancellation and static hosting
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/test-cutadapt-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutadapt-validation-${{ matrix.browser }}
          path: reports/cutadapt/${{ matrix.browser }}/
          if-no-files-found: ignore
  release-gate:
    needs: [build, browsers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the build and all browser comparisons
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - uses: actions/download-artifact@v4
        with:
          name: cutadapt-compiled
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: cutadapt-validation-*
          path: build/cutadapt-validation-artifacts
      - name: Collect the exact comparison reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for engine in ('node', 'chromium', 'firefox', 'webkit'):
              source = Path('build/cutadapt-validation-artifacts') / f'cutadapt-validation-{engine}'
              matches = list(source.rglob('summary-all.json'))
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one {engine} comparison report, found {len(matches)}')
              target = Path('reports/cutadapt') / engine / 'summary-all.json'
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(matches[0], target)
          PY
      - name: Fetch pinned original data and assemble the tested package
        run: |
          python3 scripts/fetch-cutadapt-test-data.py --fetch-sources
          python3 scripts/fetch-cutadapt-test-data.py --verify
          reports=()
          for engine in node chromium firefox webkit; do
            reports+=(--validation-report "reports/cutadapt/$engine/summary-all.json")
          done
          python3 scripts/package-cutadapt.py --output releases "${reports[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: cutadapt-package
          path: |
            releases/cutadapt-*-wasm.zip
            releases/cutadapt-*-wasm.zip.sha256
          if-no-files-found: error
          retention-days: 30
