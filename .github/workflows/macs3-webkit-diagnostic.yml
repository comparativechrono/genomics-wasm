name: Diagnose MACS3 WebKit execution
on:
  push:
    branches: [codex/macs3-webkit-debug]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        mode: [production, no-omg, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - uses: actions/download-artifact@v4
        with:
          name: macs3-compiled
          run-id: 38421000422
          github-token: ${{ github.token }}
          path: build
      - run: tar -xzf build/macs3-compiled.tar.gz
      - name: Run diagnostic probes against the existing compiled build
        env:
          DIAG_MODE: ${{ matrix.mode }}
        run: |
          if [ "$DIAG_MODE" = stage ]; then
            export DIAG_PRODUCTION=0
          else
            export DIAG_PRODUCTION=1
          fi
          if [ "$DIAG_MODE" = no-omg ]; then
            export JSC_useOMGJIT=false
          fi
          node scripts/diagnose-macs3.mjs --engine webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macs3-webkit-diagnostic-${{ matrix.mode }}
          path: build/macs3-validator-diagnostics/
          if-no-files-found: warn
