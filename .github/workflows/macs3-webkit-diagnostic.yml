name: Diagnose MACS3 WebKit execution
on:
  push:
    branches: [codex/macs3-webkit-debug]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - uses: actions/download-artifact@v4
        with:
          name: macs3-compiled
          run-id: 38421000422
          github-token: ${{ github.token }}
          path: build
      - run: tar -xzf build/macs3-compiled.tar.gz
      - name: Run diagnostic probes against the existing compiled build
        env:
          DIAG_PRODUCTION: '0'
          DIAG_WORKER: sync
        run: |
          diag_status=0
          for attempt in 1 2; do
            if ! node scripts/diagnose-macs3.mjs --engine webkit; then
              diag_status=1
            fi
          done
          exit "$diag_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macs3-webkit-sync-${{ matrix.sample }}
          path: build/macs3-validator-diagnostics/
          if-no-files-found: warn
