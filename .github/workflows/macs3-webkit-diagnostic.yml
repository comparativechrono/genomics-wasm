name: Diagnose MACS3 WebKit execution
on:
  push:
    branches: [codex/macs3-webkit-debug]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        tier: [default, no-omg]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - uses: actions/download-artifact@v4
        with:
          name: macs3-compiled
          run-id: 38421000422
          github-token: ${{ github.token }}
          path: build
      - run: tar -xzf build/macs3-compiled.tar.gz
      - name: Run diagnostic probes against the existing compiled build
        env:
          BROWSER: webkit
          DIAG_CASES: probe,callpeak-model,callpeak-shift,predictd-bed
          DIAG_TIMEOUT: '60000'
          JIT_TIER: ${{ matrix.tier }}
        run: |
          if [ "$JIT_TIER" = no-omg ]; then
            export JSC_useOMGJIT=false
          fi
          node build/macs3-webkit-diagnostics/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macs3-webkit-diagnostic-${{ matrix.tier }}
          path: build/macs3-webkit-diagnostics/logs-*/
          if-no-files-found: warn
