name: Build and validate Strelka2
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
concurrency:
  group: strelka2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake make curl xz-utils bzip2 zlib1g-dev libbz2-dev liblzma-dev libncurses-dev libffi-dev
      - run: npm ci
      - name: Test runtime, comparators and package checks
        run: npm test
      - name: Verify and regenerate the real input data
        run: |
          python3 -m pip install pysam==0.23.3
          python3 scripts/fetch-strelka2-test-data.py --verify
          python3 scripts/fetch-strelka2-test-data.py --fetch-sources
          python3 scripts/fetch-strelka2-test-data.py --regenerate
      - name: Build Python for the unchanged native workflow
        run: python3 scripts/setup-strelka2-python.py
      - name: Install pinned WebAssembly compiler
        run: bash scripts/setup-emsdk.sh
      - name: Build unchanged native, patched native and WebAssembly programs
        run: |
          source toolchain/emsdk/emsdk_env.sh
          export PATH="$PWD/build/strelka2-python/bin:$PATH"
          bash scripts/build-strelka2.sh all
      - name: Compare Node results with the unchanged native workflow
        run: node scripts/validate-strelka2.mjs --engine node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strelka2-validation-node
          path: reports/strelka2/node/
          if-no-files-found: ignore
      - name: Preserve native program permissions and interpreter links
        run: |
          tar -czf build/strelka2-compiled.tar.gz \
            dist/strelka2 build/native/strelka2 build/native/strelka2-package \
            build/patched-native/strelka2 build/patched-native/strelka2-package \
            build/strelka2-python
      - uses: actions/upload-artifact@v4
        with:
          name: strelka2-compiled
          path: build/strelka2-compiled.tar.gz
          if-no-files-found: error
          retention-days: 14
  browsers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: strelka2-compiled
          path: build
      - run: tar -xzf build/strelka2-compiled.tar.gz
      - name: Compare browser results with the unchanged native workflow
        run: node scripts/validate-strelka2.mjs --engine ${{ matrix.browser }}
      - name: Check the example page and ordinary static hosting
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/test-strelka2-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strelka2-validation-${{ matrix.browser }}
          path: reports/strelka2/${{ matrix.browser }}/
          if-no-files-found: ignore
  release-gate:
    needs: [build, browsers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require every build and browser comparison
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: strelka2-compiled
          path: build
      - run: tar -xzf build/strelka2-compiled.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: strelka2-validation-*
          path: build/strelka2-validation-artifacts
      - name: Collect the exact comparison reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          base = Path('build/strelka2-validation-artifacts')
          for engine in ('node', 'chromium', 'firefox', 'webkit'):
              filename = 'summary-strelka2-all.json'
              matches = list((base / f'strelka2-validation-{engine}').rglob(filename))
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one {engine} report, found {len(matches)}')
              target = Path('reports/strelka2') / engine / filename
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(matches[0], target)
          PY
      - name: Fetch pinned original sources for the offline package
        run: |
          python3 scripts/fetch-strelka2-test-data.py --fetch-sources
          python3 scripts/fetch-strelka2-test-data.py --verify
      - name: Package tested programs, sources, data and reports
        run: |
          reports=()
          for engine in node chromium firefox webkit; do
            reports+=(--validation-report "reports/strelka2/$engine/summary-strelka2-all.json")
          done
          python3 scripts/package-strelka2.py --output releases "${reports[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: strelka2-package
          path: |
            releases/strelka2-*-wasm.zip
            releases/strelka2-*-wasm.zip.sha256
          if-no-files-found: error
          retention-days: 30
