name: Build and validate DESeq2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deseq2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libblas-dev liblapack-dev
          for library in blas lapack; do
            for suffix in so so.3; do
              sudo update-alternatives --set "lib${library}.${suffix}-x86_64-linux-gnu" "/usr/lib/x86_64-linux-gnu/${library}/lib${library}.${suffix}"
            done
          done
          Rscript --vanilla -e 's <- sessionInfo(); print(s); stopifnot(grepl("/blas/", s$BLAS, fixed=TRUE), grepl("/lapack/", s$LAPACK, fixed=TRUE))'
          npm ci
      - name: Test comparators and verify real count data
        run: |
          npm test
          python3 scripts/fetch-deseq2-data.py --verify
          python3 scripts/fetch-deseq2-data.py --regenerate --output build/deseq2-data/reproduced
      - uses: actions/cache/restore@v4
        id: locfit-cache
        with:
          path: build/deseq2/locfit/
          key: deseq2-locfit-${{ runner.os }}-${{ hashFiles('scripts/build-deseq2-locfit.sh', 'tools/deseq2/locfit-build.R', 'tools/deseq2/locfit.lock.json') }}
      - name: Build locfit for webR with its C17 compiler
        if: steps.locfit-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-deseq2-locfit.sh
      - uses: actions/cache/save@v4
        if: steps.locfit-cache.outputs.cache-hit != 'true'
        with:
          path: build/deseq2/locfit/
          key: ${{ steps.locfit-cache.outputs.cache-primary-key }}
      - name: Assemble pinned R and DESeq2 browser files
        run: python3 scripts/build-deseq2.py
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            build/deseq2-native/runtime-library/
            build/deseq2-native/build-library/
          key: deseq2-native-${{ runner.os }}-r4.6.0-reference-blas-${{ hashFiles('scripts/setup-deseq2-native.py', 'tools/deseq2/sources.lock.json') }}
      - name: Build matching native R packages from source
        run: python3 scripts/setup-deseq2-native.py
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/deseq2-native/runtime-library/
            build/deseq2-native/build-library/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Compare native R and webR in Node
        run: node scripts/validate-deseq2.mjs --engine node --rscript build/deseq2-native/Rscript
      - name: Prepare standalone DESeq2 package
        run: python3 scripts/package-deseq2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deseq2-validation-node
          path: |
            reports/deseq2/node/
            build/deseq2-native/logs/
            build/deseq2-native/native-build.json
            build/deseq2/locfit/*txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: deseq2-validation-inputs
          path: |
            dist/deseq2/
            reports/deseq2/node/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: deseq2-candidate-package
          path: releases/deseq2-*.zip
          retention-days: 30
          if-no-files-found: error
  browsers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: deseq2-validation-inputs
          path: .
      - name: Compare actual browser results with native R
        run: node scripts/validate-deseq2.mjs --engine ${{ matrix.browser }} --native-baseline reports/deseq2/node/native
      - name: Test uploads, analysis, downloads and cancellation
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/test-deseq2-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deseq2-validation-${{ matrix.browser }}
          path: reports/deseq2/${{ matrix.browser }}/
          if-no-files-found: ignore
  release-gate:
    needs: [build, browsers]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require native and all browser checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          name: deseq2-candidate-package
          path: releases
      - uses: actions/upload-artifact@v4
        with:
          name: deseq2-package
          path: releases/
          retention-days: 30
          if-no-files-found: error
