name: Build and validate
on:
  push:
    branches-ignore:
      - 'diagnostics/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang git curl xz-utils autoconf automake libtool pkg-config
          npm ci
      - name: Test runtime and comparators
        run: npm test
      - name: Verify real data fixtures
        run: |
          python3 scripts/fetch-test-data.py --verify
          python3 scripts/fetch-rna-test-data.py --verify
      - name: Install pinned WebAssembly compiler
        run: bash scripts/setup-emsdk.sh
      - name: Build original native, patched native and WebAssembly programs
        run: |
          source toolchain/emsdk/emsdk_env.sh
          bash scripts/build-bwa.sh all
          bash scripts/build-bwa-mem2.sh all
          bash scripts/build-freebayes.sh all
          bash scripts/build-seqtk.sh all
          bash scripts/build-adapterremoval.sh all
          bash scripts/build-hisat2.sh all
          bash scripts/build-minimap2.sh all
      - name: Compare native and WebAssembly outputs in Node
        run: node scripts/validate.mjs --engine node
      - name: Check BWA-MEM2 memory exhaustion fails safely
        run: node scripts/test-bwa-mem2-memory.mjs
      - name: Prepare independent tool packages and corresponding sources
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-node
          path: reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-tools
          path: |
            dist/
            build/native/
            build/patched-native/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-packages
          path: releases/
          retention-days: 30
  browsers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: compiled-tools
          path: .
      - run: chmod -R u+x build/native build/patched-native
      - name: Compare actual browser results against native programs
        run: node scripts/validate.mjs --engine ${{ matrix.browser }}
      - name: Test browser example using compiled programs
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/test-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.browser }}
          path: reports/
          if-no-files-found: ignore
  release-gate:
    needs: [build, browsers]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          name: candidate-packages
          path: releases
      - uses: actions/upload-artifact@v4
        with:
          name: tool-packages
          path: releases/
          retention-days: 30
