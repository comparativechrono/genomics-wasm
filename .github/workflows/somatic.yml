name: Build and validate somatic callers
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
concurrency:
  group: somatic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        tool: [somaticsniper, lofreq]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make curl xz-utils zlib1g-dev libbz2-dev liblzma-dev libncurses-dev
      - run: npm ci
      - name: Test runtime, comparators and package checks
        run: npm test
      - name: Verify the real input data
        run: |
          python3 -m pip install pysam==0.23.3
          python3 scripts/fetch-somatic-test-data.py --verify
          python3 scripts/fetch-somatic-test-data.py --fetch-sources
          python3 scripts/fetch-somatic-test-data.py --regenerate
      - name: Install pinned WebAssembly compiler
        run: bash scripts/setup-emsdk.sh
      - name: Build unchanged native, patched native and WebAssembly programs
        run: |
          source toolchain/emsdk/emsdk_env.sh
          bash scripts/build-${{ matrix.tool }}.sh all
      - name: Compare Node results with the unchanged native program
        run: node scripts/validate-somatic.mjs --tool ${{ matrix.tool }} --engine node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: somatic-validation-${{ matrix.tool }}-node
          path: reports/somatic/node/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: somatic-compiled-${{ matrix.tool }}
          path: |
            dist/${{ matrix.tool }}/
            build/native/${{ matrix.tool }}*
            build/patched-native/${{ matrix.tool }}*
          if-no-files-found: error
          retention-days: 14
  browsers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        tool: [somaticsniper, lofreq]
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: somatic-compiled-${{ matrix.tool }}
          path: .
      - run: chmod u+x build/native/${{ matrix.tool }}* build/patched-native/${{ matrix.tool }}*
      - name: Compare browser outputs with the unchanged native program
        run: node scripts/validate-somatic.mjs --tool ${{ matrix.tool }} --engine ${{ matrix.browser }}
      - name: Check example, downloads, cancellation and static hosting
        env:
          BROWSER: ${{ matrix.browser }}
          SOMATIC_TOOL: ${{ matrix.tool }}
        run: node scripts/test-somatic-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: somatic-validation-${{ matrix.tool }}-${{ matrix.browser }}
          path: reports/somatic/${{ matrix.browser }}/
          if-no-files-found: ignore
  release-gate:
    needs: [build, browsers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every build and browser comparison
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: somatic-compiled-*
          merge-multiple: true
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: somatic-validation-*
          path: build/somatic-validation-artifacts
      - name: Collect the exact comparison reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          base = Path('build/somatic-validation-artifacts')
          for tool in ('somaticsniper', 'lofreq'):
              for engine in ('node', 'chromium', 'firefox', 'webkit'):
                  filename = f'summary-{tool}-all.json'
                  matches = list((base / f'somatic-validation-{tool}-{engine}').rglob(filename))
                  if len(matches) != 1:
                      raise RuntimeError(f'Expected one {tool}/{engine} report, found {len(matches)}')
                  target = Path('reports/somatic') / engine / filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(matches[0], target)
          PY
      - name: Fetch pinned original dataset sources for offline packages
        run: |
          python3 scripts/fetch-somatic-test-data.py --fetch-sources
          python3 scripts/fetch-somatic-test-data.py --verify
      - name: Package tested programs, sources, data and reports
        run: |
          reports=()
          for tool in somaticsniper lofreq; do
            for engine in node chromium firefox webkit; do
              reports+=(--validation-report "reports/somatic/$engine/summary-$tool-all.json")
            done
          done
          python3 scripts/package-somatic.py --tool all --output releases "${reports[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: somatic-packages
          path: |
            releases/somaticsniper-*-wasm.zip
            releases/lofreq-*-wasm.zip
            releases/*-wasm.zip.sha256
          if-no-files-found: error
          retention-days: 30
