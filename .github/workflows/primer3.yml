name: Build and validate Primer3
on:
  push:
    paths:
      - '.github/workflows/primer3.yml'
      - 'tools/primer3/**'
      - 'datasets/primer3/**'
      - 'validation/primer3/**'
      - 'examples/primer3/**'
      - 'runtime/primer3*.mjs'
      - 'runtime/PRIMER3.md'
      - 'scripts/*primer3*'
      - 'tests/*primer3*'
      - 'runtime/index.mjs'
      - 'runtime/worker.mjs'
      - 'runtime/execute.mjs'
      - 'scripts/setup-emsdk.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/runtime.test.mjs'
      - 'tests/fixtures/**'
      - 'LICENSE'
  pull_request:
    paths:
      - '.github/workflows/primer3.yml'
      - 'tools/primer3/**'
      - 'datasets/primer3/**'
      - 'validation/primer3/**'
      - 'examples/primer3/**'
      - 'runtime/primer3*.mjs'
      - 'runtime/PRIMER3.md'
      - 'scripts/*primer3*'
      - 'tests/*primer3*'
      - 'runtime/index.mjs'
      - 'runtime/worker.mjs'
      - 'runtime/execute.mjs'
      - 'scripts/setup-emsdk.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/runtime.test.mjs'
      - 'tests/fixtures/**'
      - 'LICENSE'
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
concurrency:
  group: primer3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake make git curl gzip xz-utils patch
      - run: npm ci
      - name: Test runtimes, comparators and package checks
        run: |
          python3 -m unittest discover -s tests -p 'test_primer3_*.py'
          node --test tests/runtime.test.mjs tests/primer3.test.mjs
      - name: Verify and regenerate pinned Primer3 inputs
        run: |
          python3 scripts/fetch-primer3-test-data.py --verify
          python3 scripts/fetch-primer3-test-data.py --fetch
          python3 scripts/fetch-primer3-test-data.py --regenerate
      - name: Install pinned WebAssembly compiler
        run: bash scripts/setup-emsdk.sh
      - name: Build unchanged native, patched native and WebAssembly primer3
        run: |
          source toolchain/emsdk/emsdk_env.sh
          bash scripts/build-primer3.sh all
      - name: Compare Node results with unchanged native primer3
        run: node scripts/validate-primer3.mjs --engine node --tool primer3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primer3-validation-node
          path: reports/primer3/node/
          if-no-files-found: ignore
      - name: Preserve executable permissions in compiled artifact
        run: |
          tar -czf build/primer3-compiled.tar.gz \
            dist/primer3 \
            build/native/primer3_core \
            build/native/ntdpal \
            build/native/ntthal \
            build/native/oligotm \
            build/native/amplicon3_core \
            build/native/long_seq_tm_test \
            build/native/primer3_masker \
            build/patched-native/primer3_core \
            build/patched-native/ntdpal \
            build/patched-native/ntthal \
            build/patched-native/oligotm \
            build/patched-native/amplicon3_core \
            build/patched-native/long_seq_tm_test \
            build/patched-native/primer3_masker
      - uses: actions/upload-artifact@v4
        with:
          name: primer3-compiled
          path: build/primer3-compiled.tar.gz
          if-no-files-found: error
          retention-days: 14
  browsers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: primer3-compiled
          path: build
      - run: tar -xzf build/primer3-compiled.tar.gz
      - name: Compare browser results with unchanged native primer3
        run: node scripts/validate-primer3.mjs --engine ${{ matrix.browser }} --tool primer3
      - name: Exercise Primer3 workflows, uploads, downloads and cancellation
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/test-primer3-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primer3-validation-${{ matrix.browser }}
          path: reports/primer3/${{ matrix.browser }}/
          if-no-files-found: ignore
  release-gate:
    needs: [build, browsers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require every native and browser comparison
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: primer3-compiled
          path: build
      - run: tar -xzf build/primer3-compiled.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: primer3-validation-*
          path: build/primer3-validation-artifacts
      - name: Collect native comparison reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          base = Path('build/primer3-validation-artifacts')
          for engine in ('node', 'chromium', 'firefox', 'webkit'):
              filename = 'summary-primer3-all.json'
              matches = list((base / f'primer3-validation-{engine}').rglob(filename))
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one {engine} report, found {len(matches)}')
              target = Path('reports/primer3') / engine / filename
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(matches[0], target)
          PY
      - name: Assemble package from pinned sources and verified evidence
        run: |
          python3 scripts/fetch-primer3-test-data.py --fetch
          python3 scripts/fetch-primer3-test-data.py --verify
          reports=()
          for engine in node chromium firefox webkit; do
            reports+=(--validation-report "reports/primer3/$engine/summary-primer3-all.json")
          done
          python3 scripts/package-primer3.py --output releases "${reports[@]}"
      - name: Install browsers for independent package tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify and exercise standalone ZIP independently
        run: |
          set -euo pipefail
          task_root="$PWD"
          archive="releases/primer3-2.6.1-wasm.zip"
          filename="$(basename "$archive")"
          stem="${filename%.zip}"
          (cd releases && sha256sum -c "$filename.sha256")
          package_root="$(mktemp -d)"
          python3 -m zipfile -e "$archive" "$package_root"
          (
            cd "$package_root/$stem"
            sha256sum -c SHA256SUMS
            npm ci
            npm test
            for engine in chromium firefox webkit; do
              BROWSER="$engine" \
                PRIMER3_DEMO_REPORT="$task_root/reports/primer3/packages/$engine" \
                node scripts/test-primer3-demo.mjs
            done
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primer3-package-validation
          path: reports/primer3/packages/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: primer3-package
          path: |
            releases/primer3-2.6.1-wasm.zip
            releases/primer3-2.6.1-wasm.zip.sha256
          if-no-files-found: error
          retention-days: 30
