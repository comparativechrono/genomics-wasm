name: Build and validate bustools
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
concurrency:
  group: bustools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake make git curl gzip xz-utils patch
      - run: npm ci
      - name: Test runtimes, comparators and package checks
        run: npm test
      - name: Verify and regenerate experimental BUS inputs
        run: |
          python3 scripts/fetch-bustools-test-data.py --verify
          python3 scripts/fetch-bustools-test-data.py --fetch
          python3 scripts/fetch-bustools-test-data.py --regenerate
      - name: Install pinned WebAssembly compiler
        run: bash scripts/setup-emsdk.sh
      - name: Build unchanged native, patched native and WebAssembly bustools
        run: |
          source toolchain/emsdk/emsdk_env.sh
          bash scripts/build-bustools.sh all
      - name: Compare Node results with unchanged native bustools
        run: node scripts/validate-bustools.mjs --engine node --tool bustools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bustools-validation-node
          path: reports/bustools/node/
          if-no-files-found: ignore
      - name: Preserve executable permissions in compiled artifact
        run: |
          tar -czf build/bustools-compiled.tar.gz \
            dist/bustools build/native/bustools build/patched-native/bustools
      - uses: actions/upload-artifact@v4
        with:
          name: bustools-compiled
          path: build/bustools-compiled.tar.gz
          if-no-files-found: error
          retention-days: 14
  browsers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: bustools-compiled
          path: build
      - run: tar -xzf build/bustools-compiled.tar.gz
      - name: Compare browser results with unchanged native bustools
        run: node scripts/validate-bustools.mjs --engine ${{ matrix.browser }} --tool bustools
      - name: Exercise BUS workflows, uploads, downloads and cancellation
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/test-bustools-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bustools-validation-${{ matrix.browser }}
          path: reports/bustools/${{ matrix.browser }}/
          if-no-files-found: ignore
  release-gate:
    needs: [build, browsers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require every native and browser comparison
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bustools-compiled
          path: build
      - run: tar -xzf build/bustools-compiled.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: bustools-validation-*
          path: build/bustools-validation-artifacts
      - name: Collect exact comparison reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          base = Path('build/bustools-validation-artifacts')
          for engine in ('node', 'chromium', 'firefox', 'webkit'):
              filename = 'summary-bustools-all.json'
              matches = list((base / f'bustools-validation-{engine}').rglob(filename))
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one {engine} report, found {len(matches)}')
              target = Path('reports/bustools') / engine / filename
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(matches[0], target)
          PY
      - name: Assemble package from pinned sources and verified evidence
        run: |
          python3 scripts/fetch-bustools-test-data.py --fetch
          python3 scripts/fetch-bustools-test-data.py --verify
          reports=()
          for engine in node chromium firefox webkit; do
            reports+=(--validation-report "reports/bustools/$engine/summary-bustools-all.json")
          done
          python3 scripts/package-bustools.py --output releases "${reports[@]}"
      - name: Install browsers for independent package tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify and exercise standalone ZIP independently
        run: |
          set -euo pipefail
          task_root="$PWD"
          archive="releases/bustools-0.45.1-wasm.zip"
          filename="$(basename "$archive")"
          stem="${filename%.zip}"
          (cd releases && sha256sum -c "$filename.sha256")
          package_root="$(mktemp -d)"
          python3 -m zipfile -e "$archive" "$package_root"
          (
            cd "$package_root/$stem"
            sha256sum -c SHA256SUMS
            npm ci
            npm test
            for engine in chromium firefox webkit; do
              BROWSER="$engine" \
                BUSTOOLS_DEMO_REPORT="$task_root/reports/bustools/packages/$engine" \
                node scripts/test-bustools-demo.mjs
            done
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bustools-package-validation
          path: reports/bustools/packages/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: bustools-package
          path: |
            releases/bustools-0.45.1-wasm.zip
            releases/bustools-0.45.1-wasm.zip.sha256
          if-no-files-found: error
          retention-days: 30
